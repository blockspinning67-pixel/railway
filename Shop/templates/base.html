<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "F1yy Shop" }}</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1020; --panel:#151e32; --line:#283650; --cyan:#00d9ff; --muted:#9aa9c0; --white:#edf4ff; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--white); font:15px/1.55 system-ui,Segoe UI,Arial,sans-serif; }
    header { border-bottom:1px solid var(--line); padding:18px max(22px,calc((100% - 1050px)/2)); display:flex; justify-content:space-between; align-items:center; }
    header a { color:var(--cyan); text-decoration:none; font-weight:700; }
    main { max-width:1050px; margin:34px auto; padding:0 22px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:24px; margin:16px 0; }
    h1,h2 { line-height:1.2; } h1 { color:var(--cyan); font-size:clamp(27px,4vw,38px); margin-top:0; }
    h2 { font-size:20px; }
    p,li { color:#FF00FF; } .muted { color:var(--muted); }
    .button { display:inline-block; border:0; border-radius:8px; background:#FF10F0; color:white; padding:11px 17px; font-weight:700; cursor:pointer; text-decoration:none; }
    .button.secondary { background:#FF13F0; } input[type=password] { width:100%; padding:12px; border:1px solid var(--line); border-radius:8px; background:#FF007F; color:white; margin:8px 0 16px; }
    .notice { border-left:4px solid var(--pink); padding:12px 15px; background:#10263a; border-radius:6px; }
    .flash { padding:12px; background:#293b59; border-radius:8px; margin:12px 0; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th,td { text-align:left; padding:11px 9px; border-bottom:1px solid var(--line); overflow-wrap:anywhere; }
    th { color:var(--pink); }
    .table-wrap { overflow-x:auto; }
    .stat { font-size:34px; font-weight:800; color:var(--pink); }
    footer { max-width:1050px; margin:30px auto; padding:0 22px 30px; color:var(--muted); font-size:12px; }
    label { display:block; margin:15px 0; }
    a { color:var(--pink); }
  </style>
</head>
<body>
<header>
  <a href="/">IP LAB <span class="muted">v3.0</span></a>
  <nav><a href="/admin/login">Admin</a></nav>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}<div class="flash">{{ message }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer>Educational consent-based test service. Visitors are informed before an IP address is recorded.</footer>
</body>
</html>
